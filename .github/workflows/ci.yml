name: Build and Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
             libwxgtk3.2-dev libavcodec-dev libavformat-dev libswscale-dev \
             libcurl4-openssl-dev libavutil-dev liblua5.1-0-dev flam3-utils \
             libflam3-dev libgtop2-dev libboost-dev libboost-thread-dev \
             libboost-system-dev libboost-filesystem-dev libtinyxml-dev \
             freeglut3-dev libpng-dev git dos2unix

    - name: Configure and Build
      run: |
        ./autogen.sh
        ./configure
        make -j$(nproc) check

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        brew install automake autoconf libtool pkg-config ffmpeg curl boost \
             lua@5.1 tinyxml libpng wxwidgets

    - name: Configure and Build
      run: |
        ./autogen.sh
        ./configure
        make -j$(sysctl -n hw.ncpu) check
